
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t liatrio-apprentice-app .

      - name: Run Docker container
        run: docker run -d -p 80:3000 liatrio-apprentice-app

      - name: Verify application is ready
        run: curl --fail --retry 10 --retry-delay 1 http://localhost/

      - name: Verify minified JSON
        shell: bash
        run: |
          curl --fail --silent --show-error http://localhost/ | python3 -c '
          import json
          import sys

          raw = sys.stdin.buffer.read()
          data = json.loads(raw)
          compact = json.dumps(data, separators=(",", ":"), ensure_ascii=False).encode("utf-8")

          if raw != compact:
              print("FAIL: JSON response is not minified")
              sys.exit(1)

          print("PASS: JSON response is valid and minified")
          '

      - name: Run Liatrio verification
        uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag liatrio-apprentice-app tpgotmotion/liatrio-apprentice-app:${{ github.run_number }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push tpgotmotion/liatrio-apprentice-app:${{ github.run_number }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: project-c127ebd7-215e-4a00-ba1

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: liatrio-apprentice-app
          region: us-west1
          project_id: project-c127ebd7-215e-4a00-ba1
          image: docker.io/tpgotmotion/liatrio-apprentice-app:${{ github.run_number }}
          flags: --port=3000

      - name: Verify Cloud Run deployment
        run: curl --fail --show-error --silent --retry 5 --retry-delay 2 "${{ steps.deploy.outputs.url }}"
